name: Build and Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  release:
    name: Build Latest Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build assets
        run: npm run build

      - name: Package release assets
        run: |
          mkdir release
          cp LICENSE dist/LICENSE
          cd dist
          zip -r ../release/dufs-interface-assets.zip .
          cd ../release
          sha256sum dufs-interface-assets.zip > dufs-interface-assets.zip.sha256

      - name: Publish Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated build from $GITHUB_SHA"
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth_headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          releases_json="$(curl --fail-with-body --silent --show-error "${auth_headers[@]}" "$api_url/releases?per_page=100")"
          release_json="$(jq --compact-output '[.[] | select(.tag_name == "Latest")] | first' <<< "$releases_json")"
          if [ "$release_json" = null ]; then
            release_json="$(curl --fail-with-body --silent --show-error --request POST "${auth_headers[@]}" "$api_url/releases" \
              --data "{\"tag_name\":\"Latest\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"Latest\",\"body\":\"$notes\",\"make_latest\":true}")"
          fi

          release_id="$(jq --raw-output '.id' <<< "$release_json")"
          curl --fail-with-body --silent --show-error --request PATCH "${auth_headers[@]}" "$api_url/releases/$release_id" \
            --data "{\"name\":\"Latest\",\"body\":\"$notes\",\"make_latest\":true}"

          for asset_name in dufs-interface-assets.zip dufs-interface-assets.zip.sha256; do
            asset_id="$(jq --raw-output --arg name "$asset_name" '.assets[] | select(.name == $name) | .id' <<< "$release_json")"
            if [ -n "$asset_id" ]; then
              curl --fail-with-body --silent --show-error --request DELETE "${auth_headers[@]}" "$api_url/releases/assets/$asset_id"
            fi
          done

          curl --fail-with-body --silent --show-error --request POST "${auth_headers[@]}" \
            -H "Content-Type: application/zip" \
            --data-binary @release/dufs-interface-assets.zip \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=dufs-interface-assets.zip"
          curl --fail-with-body --silent --show-error --request POST "${auth_headers[@]}" \
            -H "Content-Type: text/plain" \
            --data-binary @release/dufs-interface-assets.zip.sha256 \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=dufs-interface-assets.zip.sha256"

      - name: Move the Latest tag to this build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --force Latest "$GITHUB_SHA"
          git push origin refs/tags/Latest --force
